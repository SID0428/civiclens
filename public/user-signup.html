<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Sign Up (Email OTP) | CivicLens</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between font-sans text-slate-800 antialiased selection:bg-sky-500 selection:text-white">

  <!-- Header -->
  <header class="p-6">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="index.html" class="flex items-center space-x-2.5 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-600 to-blue-600 flex items-center justify-center text-white text-lg font-bold shadow-md shadow-sky-500/20 group-hover:scale-105 transition">
          <i class="fa-solid fa-camera-retro"></i>
        </div>
        <span class="text-xl font-extrabold text-slate-900 tracking-tight">Civic<span class="text-sky-600">Lens</span></span>
      </a>
      <a href="index.html" class="text-xs font-semibold text-slate-500 hover:text-slate-800 transition flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-left text-[10px]"></i> Back to Home
      </a>
    </div>
  </header>

  <!-- Signup Card -->
  <main class="flex-1 flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-lg bg-white rounded-3xl p-8 sm:p-10 shadow-xl shadow-slate-200/60 border border-slate-200/80">
      
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-sky-50 text-sky-600 text-xl mb-3">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Create Citizen Account</h1>
        <p class="text-xs text-slate-500 mt-1">Verify via Google SMTP Email OTP for authentic grievance tracking</p>
      </div>

      <!-- Form -->
      <form id="signupForm" class="space-y-4">
        
        <!-- Full Name -->
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Full Name</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3.5 top-3 text-slate-400 text-xs"></i>
            <input type="text" id="name" required placeholder="Aarav Sharma" class="w-full pl-9 pr-4 py-2.5 bg-slate-50/70 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition">
          </div>
        </div>

        <!-- Phone Number -->
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Mobile Number (Optional)</label>
          <div class="relative">
            <i class="fa-solid fa-phone absolute left-3.5 top-3 text-slate-400 text-xs"></i>
            <input type="tel" id="phone" placeholder="+91 98765 43210" class="w-full pl-9 pr-4 py-2.5 bg-slate-50/70 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition">
          </div>
        </div>

        <!-- Email & Send OTP Row -->
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
          <div class="flex gap-2">
            <div class="relative flex-1">
              <i class="fa-solid fa-envelope absolute left-3.5 top-3 text-slate-400 text-xs"></i>
              <input type="email" id="email" required placeholder="aarav@gmail.com" class="w-full pl-9 pr-4 py-2.5 bg-slate-50/70 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition">
            </div>
            <button type="button" id="sendOtpBtn" onclick="handleSendOTP()" class="px-4 py-2.5 bg-sky-50 hover:bg-sky-100 text-sky-700 font-bold text-xs rounded-xl border border-sky-200 transition whitespace-nowrap">
              Send OTP
            </button>
          </div>
          <p id="otpStatus" class="text-[11px] text-slate-500 mt-1 hidden"></p>
        </div>

        <!-- 6-digit OTP Field -->
        <div id="otpContainer" class="bg-sky-50/50 p-4 rounded-2xl border border-sky-100 space-y-2">
          <div class="flex justify-between items-center">
            <label class="block text-xs font-bold text-sky-950 uppercase tracking-wider">
              Enter 6-Digit Email OTP
            </label>
            <span class="text-[10px] text-sky-700 font-semibold">Google SMTP</span>
          </div>
          <div class="relative">
            <i class="fa-solid fa-key absolute left-3.5 top-3 text-sky-400 text-xs"></i>
            <input type="text" id="otp" maxlength="6" placeholder="e.g. 849201" class="w-full pl-9 pr-4 py-2.5 bg-white border border-sky-200 rounded-xl text-xs font-mono tracking-widest text-sky-950 focus:ring-2 focus:ring-sky-500 focus:outline-none transition">
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Create Password</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-400 text-xs"></i>
            <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" class="w-full pl-9 pr-4 py-2.5 bg-slate-50/70 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full py-3 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs shadow-md shadow-sky-500/20 hover:shadow-lg transition">
          Verify OTP & Complete Registration
        </button>
      </form>

      <!-- Bottom link -->
      <div class="text-center mt-6 pt-6 border-t border-slate-100 text-xs text-slate-500">
        Already registered? 
        <a href="user-login.html" class="font-bold text-sky-600 hover:underline ml-1">Sign In Here</a>
      </div>

    </div>
  </main>

  <footer class="p-6 text-center text-xs text-slate-400">
    &copy; 2026 CivicLens &bull; Smart Citizen Grievance Portal
  </footer>

  <script src="js/api.js"></script>
  <script>
    async function handleSendOTP() {
      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('sendOtpBtn');
      const statusEl = document.getElementById('otpStatus');

      if (!email) {
        API.showToast("Please enter your email address first.", "warning");
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Sending...';
      statusEl.classList.remove('hidden');
      statusEl.innerText = 'Dispatching OTP via Google SMTP...';
      statusEl.className = 'text-[11px] text-sky-700 mt-1';

      try {
        const res = await API.request('/auth/send-otp', 'POST', { email, purpose: 'Signup' });
        API.showToast(res.message || "OTP sent to your email!", "success");
        btn.innerText = 'Resend OTP';
        btn.disabled = false;

        if (res.devOtp) {
          statusEl.innerHTML = `<span class="text-emerald-600 font-semibold">Dev Mode OTP: <strong class="font-mono text-sm">${res.devOtp}</strong></span> (Auto-filled)`;
          document.getElementById('otp').value = res.devOtp;
        } else {
          statusEl.innerText = 'Check your email inbox (and spam) for the 6-digit OTP code.';
        }
      } catch (err) {
        API.showToast(err.message || "Failed to send OTP", "error");
        btn.disabled = false;
        btn.innerText = 'Send OTP';
        statusEl.innerText = err.message;
        statusEl.className = 'text-[11px] text-red-600 mt-1';
      }
    }

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const email = document.getElementById('email').value.trim();
      const otp = document.getElementById('otp').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');

      if (!otp || otp.length < 6) {
        API.showToast("Please enter the 6-digit OTP received on your email.", "warning");
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Verifying & Registering...';

      try {
        const res = await API.request('/auth/register-with-otp', 'POST', {
          name,
          phone,
          email,
          otp,
          password,
        });

        API.setAuth(res.token, res.user, 'citizen');
        API.showToast("Account created successfully!", "success");
        setTimeout(() => {
          window.location.href = 'user-dashboard.html';
        }, 1000);
      } catch (err) {
        API.showToast(err.message || "Registration failed", "error");
        btn.disabled = false;
        btn.innerText = 'Verify OTP & Complete Registration';
      }
    });
  </script>
</body>
</html>
