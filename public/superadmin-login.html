<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin Master Portal | CivicLens</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between font-sans text-slate-800 antialiased selection:bg-purple-500 selection:text-white">

  <!-- Header -->
  <header class="p-6">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="index.html" class="flex items-center space-x-2.5 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-600 flex items-center justify-center text-white text-lg font-bold shadow-md shadow-purple-500/20 group-hover:scale-105 transition">
          <i class="fa-solid fa-crown"></i>
        </div>
        <div>
          <span class="text-xl font-extrabold text-slate-900 tracking-tight">Civic<span class="text-purple-600">Lens</span></span>
          <span class="block text-[10px] font-bold text-purple-600 uppercase tracking-wider">Super Admin Master</span>
        </div>
      </a>
      <a href="index.html" class="text-xs font-semibold text-slate-500 hover:text-slate-800 transition flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-left text-[10px]"></i> Home
      </a>
    </div>
  </header>

  <!-- Login Card -->
  <main class="flex-1 flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md bg-white rounded-3xl p-8 sm:p-10 shadow-xl shadow-slate-200/60 border border-slate-200/80">
      
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-purple-50 text-purple-600 text-xl mb-3">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Super Admin Master Login</h1>
        <p class="text-xs text-slate-500 mt-1">State-level governance, Sub-Admin provisioning & KPI analytics</p>
      </div>

      <!-- SIH Demo Credentials Notice -->
      <div class="mb-6 p-3 bg-purple-50/70 border border-purple-100 rounded-2xl text-[11px] text-purple-900 space-y-0.5">
        <div class="font-bold flex items-center gap-1">
          <i class="fa-solid fa-key text-purple-600"></i> Demo Master Credentials:
        </div>
        <div>Email: <span class="font-mono font-bold">superadmin@civiclens.gov.in</span></div>
        <div>Password: <span class="font-mono font-bold">SuperAdmin@2026</span></div>
      </div>

      <!-- Form -->
      <form id="superAdminLoginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Super Admin Email</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
            <input type="email" id="email" value="superadmin@civiclens.gov.in" required class="w-full pl-9 pr-4 py-2.5 bg-slate-50/70 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-purple-500 focus:outline-none transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Master Password</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
            <input type="password" id="password" value="SuperAdmin@2026" required class="w-full pl-9 pr-4 py-2.5 bg-slate-50/70 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-purple-500 focus:outline-none transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Master Security Key (Optional)</label>
          <div class="relative">
            <i class="fa-solid fa-fingerprint absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
            <input type="password" id="masterKey" placeholder="CIVICLENS_SUPER_ADMIN_MASTER_KEY_2026" class="w-full pl-9 pr-4 py-2.5 bg-slate-50/70 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-purple-500 focus:outline-none transition">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full py-3 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs shadow-md shadow-purple-500/20 hover:shadow-lg transition">
          Access Master Governance Console
        </button>
      </form>

      <!-- Bottom link -->
      <div class="text-center mt-6 pt-6 border-t border-slate-100 text-xs text-slate-500">
        <a href="admin-login.html" class="hover:text-purple-600 transition">
          &larr; Switch to District Sub-Admin Portal
        </a>
      </div>

    </div>
  </main>

  <footer class="p-6 text-center text-xs text-slate-400">
    &copy; 2026 CivicLens &bull; State Grievance Redressal HQ
  </footer>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('superAdminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const masterKey = document.getElementById('masterKey').value.trim();
      const btn = document.getElementById('submitBtn');

      btn.disabled = true;
      btn.innerText = 'Authenticating Super Admin...';

      try {
        const res = await API.request('/auth/superadmin-login', 'POST', {
          email,
          password,
          masterKey: masterKey || undefined,
        });

        API.setAuth(res.token, res.superAdmin, 'superadmin');
        API.showToast('Super Admin access granted!', 'success');
        setTimeout(() => {
          window.location.href = 'superadmin-dashboard.html';
        }, 800);
      } catch (err) {
        API.showToast(err.message || 'Super Admin authentication failed', 'error');
        btn.disabled = false;
        btn.innerText = 'Access Master Governance Console';
      }
    });
  </script>
</body>
</html>
